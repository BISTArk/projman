name: Release desktop apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure the tag matches every app version
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const expected = process.env.EXPECTED.replace(/^v/, "");
            const packageVersion = require("./package.json").version;
            const tauriVersion = require("./src-tauri/tauri.conf.json").version;
            const cargoVersion = fs.readFileSync("./src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1];
            for (const [file, version] of [["package.json", packageVersion], ["tauri.conf.json", tauriVersion], ["Cargo.toml", cargoVersion]]) {
              if (version !== expected) throw new Error(`${file} has ${version}; expected ${expected}`);
            }
          '
        env:
          EXPECTED: ${{ github.ref_name }}

  build-and-upload:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            rust_targets: ""
            args: "--bundles nsis,msi --config src-tauri/tauri.release.conf.json"
          - os: macos
            runner: macos-latest
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json"
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - name: Install frontend dependencies
        run: npm ci

      - name: Require the updater signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Configure TAURI_SIGNING_PRIVATE_KEY before creating a release tag. It must match the public key embedded in existing ProjMan installs."
            exit 1
          fi

      - name: Import Apple Developer ID certificate
        if: matrix.os == 'macos' && env.APPLE_CERTIFICATE != ''
        shell: bash
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_ID="$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          test -n "$CERT_ID"
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Use ad-hoc signing when Apple credentials are not configured
        if: matrix.os == 'macos' && env.APPLE_CERTIFICATE == ''
        shell: bash
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ProjMan ${{ github.ref_name }}"
          releaseBody: "Install ProjMan on Windows or macOS from the assets below. Both platforms use this release for automatic updates."
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          retryAttempts: 2
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: "[name]_[version]_[platform]_[arch][setup].[ext]"
          args: ${{ matrix.args }}

  publish-and-update-feed:
    needs: build-and-upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
      - name: Mirror the unified updater manifest for existing installs
        shell: bash
        run: |
          curl --fail --location --retry 6 --retry-all-errors \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/latest.json" \
            --output docs/update.json
          cp docs/update.json update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/update.json update.json
          if ! git diff --cached --quiet; then
            git commit -m "release: update desktop updater feed for ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi
